<!DOCTYPE html>
<!-- wechat-oa article template "aginxbrowser"

和 aginxos 同一套黑底、青色。眉题换成浏览器，避免和手机稿串味。
-->
<template id="container"><section style="box-sizing:border-box;margin:0;padding:4px 0 12px;background:#f3f7f7;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:16px;line-height:1.9;color:#14201f;">
{{header}}
{{blocks}}
<p style="margin:28px 4px 0;padding:14px 0 0;border-top:1px solid #d5e4e2;font-size:12px;line-height:1.4;letter-spacing:3px;color:#5f7774;">AGINXBROWSER</p>
</section></template>

<template id="header"><section style="margin:0 0 18px;padding:22px 18px 20px;background:#0c1416;border-radius:16px;">
<p style="margin:0 0 12px;font-size:11px;line-height:1;font-weight:600;letter-spacing:3px;color:#5eead4;">AGINXBROWSER</p>
<p style="margin:0;font-size:17px;line-height:1.65;font-weight:600;color:#f0fdfa;">人用 Chrome。智能体不用去点它。</p>
</section></template>

<template id="lead"><section style="margin:0 0 8px;padding:16px 16px 14px;background:#ffffff;border:1px solid #d7e6e4;border-radius:14px;">
<p style="margin:0;font-size:17px;line-height:1.8;font-weight:600;color:#0f1c1b;">{{text}}</p>
</section></template>

<template id="h2"><section style="margin:22px 0 12px;padding:14px 16px;background:#ffffff;border:1px solid #d7e6e4;border-left:4px solid #2dd4bf;border-radius:14px;">
<p style="margin:0 0 6px;font-size:11px;line-height:1;font-weight:600;letter-spacing:2px;color:#0f766e;">{{n}}</p>
<h2 style="margin:0;font-size:18px;line-height:1.45;font-weight:700;color:#0f1c1b;text-align:left;">{{text}}</h2>
</section></template>

<template id="p"><p style="margin:0 0 16px;padding:0 6px;font-size:16px;line-height:1.95;color:#1c2b29;">{{text}}</p></template>

<template id="strong"><strong style="font-weight:700;color:#0f1c1b;">{{text}}</strong></template>

<template id="link"><span style="color:#0f766e;border-bottom:1px solid #5eead4;word-break:break-all;">{{text}}</span></template>
</html>
