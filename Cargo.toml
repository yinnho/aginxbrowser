[package]
name = "aginxbrowser"
version = "0.2.7"
edition = "2021"
authors = ["OpenCarrier Team"]
description = "Pure server-side browser engine with built-in V8. HTTP API for scraping, search, and interactive browsing. No Chromium required."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/yinnho/aginxbrowser"
homepage = "https://browser.aginx.net"
keywords = ["browser", "mcp", "web-scraping", "headless", "automation"]
categories = ["web-programming", "network-programming", "command-line-utilities", "development-tools"]

[features]
default = []
# Stealth HTTP client with TLS/JA3 fingerprint spoofing via wreq (BoringSSL).
# Disable for plain reqwest-only builds.
stealth = ["dep:wreq", "dep:wreq-util"]
# Screenshot rendering via inlined Blitz (Stylo/Taffy/vello_cpu). Adds ~30-40MB
# to the binary and notable compile time, so opt-in. Renders the JS-rendered DOM
# (captured by the obscura V8 path) to a PNG — no Chromium required.
screenshot = [
    "dep:blitz-dom",
    "dep:blitz-html",
    "dep:blitz-paint",
    "dep:blitz-traits",
    "dep:anyrender",
    "dep:anyrender_vello_cpu",
    "dep:peniko",
    "dep:png",
    # JPEG/WebP/GIF decode for diting_layout's ImageCache (batches 6d/7b/7e).
    # Same `image` crate version blitz-dom decodes with, so RGBA output is
    # identical. Animated GIFs take the first frame.
    "dep:image",
    "image/jpeg",
    "image/webp",
    "image/gif",
    # Direct stylo handle for the dual-engine computed-style cross-check
    # tests (diting_css vs Stylo) — must match the version blitz pins.
    "dep:stylo_alias",
    # Direct taffy handle for the fork-delta classification tests — same
    # git rev blitz pins, and crucially the same feature set (see below).
    "dep:taffy",
    # Real glyph measurement + rasterization for diting_layout text leaves
    # (render claim batches 3a/3b). Same stack upstream obscura-render builds
    # on. scale/render are the outline raster features (3b paint).
    "dep:swash",
    # Direct parley handle to build a fixture FontContext for the blitz side
    # of the 3a text cross-check (DocumentConfig.font_ctx injection with
    # system_fonts disabled). Same version/features blitz pins.
    "dep:parley",
]

[dependencies]
# The alias is how blitz-dom names upstream stylo; same crate, same version.
stylo_alias = { version = "0.20", package = "stylo", optional = true }
# Taffy git pin, mirroring blitz's workspace declaration after their #835
# (taffy#1177 grid contribution-skip + #1178 floor available sizes at zero).
# Features must EXACTLY mirror blitz's workspace declaration (default-features
# = false, no float_layout): cargo unifies features across the graph, so any
# extra feature here would silently change the product pipeline's layout
# behavior (float_layout alters block layout). taffy_tree is additionally
# listed because the unified graph already enables it (Cargo.lock shows taffy
# pulling slotmap) — an explicit no-op.
# Used by diting_layout fork-delta tests — see docs/engine/render.md.
taffy = { git = "https://github.com/DioxusLabs/taffy", rev = "1b918bafcab101dd234ebeb27da0443e24fd9de2", optional = true, default-features = false, features = [
    "std",
    "taffy_tree",
    "flexbox",
    "grid",
    "block_layout",
    "content_size",
    "calc",
    "detailed_layout_info",
] }
# Shaped advances + font metrics (batch 3a) and glyph rasterization (3b) for
# diting_layout text leaves. Same stack upstream obscura-render builds on.
# default-features=false + explicit std/scale/render: no variations/simd knob
# we don't use (default set is std+scale+render anyway — pin it explicitly).
swash = { version = "0.2", optional = true, default-features = false, features = [
    "std",
    "scale",
    "render",
] }
# Fixture FontContext construction for the blitz side of the 3a text
# cross-check. Mirrors blitz's own declaration exactly (default-features
# false, std) so the unified graph can't drift blitz's parley behavior.
parley = { version = "0.10", optional = true, default-features = false, features = ["std"] }
# --- async runtime ---
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# --- web framework ---
# `ws` enables axum's WebSocket extractor — the CDP bridge endpoint
# (diting_cdp) upgrades /devtools/* requests to raw WebSocket frames.
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
uuid = { version = "1", features = ["v4"] }

# --- MCP (Model Context Protocol) ---
rmcp = { version = "1.7", features = ["server", "transport-io", "transport-streamable-http-server"] }
schemars = "1"

# --- serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"

# --- tracing ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- http client (non-stealth path) ---
reqwest = { version = "0.12", features = ["cookies", "gzip", "brotli", "deflate", "rustls-tls", "socks", "json", "stream"], default-features = false }
encoding_rs = "0.8"
tempfile = "3"
url = "2"
urlencoding = "2"
http-body-util = "0.1"

# --- html / dom parsing ---
html5ever = "0.29"
markup5ever = "0.14"
selectors = "0.26"
servo_arc = "0.4"
cssparser = "0.34"
precomputed-hash = "0.1"
scraper = "0.21"
html2md = "0.2"

# --- V8 / JS runtime (inlined obscura-js) ---
deno_core = "0.411"
deno_error = "0.7"
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
# WebCrypto (crypto.subtle) secret-key primitives. RustCrypto, pure Rust, no
# CMake/OpenSSL, unify on the digest 0.10 / cipher 0.4 stack already in tree.
hmac = "0.12"
aes = "0.8"
aes-gcm = "0.10"
cbc = { version = "0.1", features = ["alloc"] }
ctr = "0.9"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hkdf = "0.12"
# CSPRNG for getRandomValues / randomUUID (replaces Math.random).
getrandom = "0.2"

# --- stealth client (TLS fingerprint spoofing) ---
# Pin exact versions: wreq/wreq-util are pre-release rc crates whose API shifts
# between builds; a caret requirement could pull an incompatible rc and break.
# prefix-symbols renames BoringSSL exports to avoid clashing with system OpenSSL,
# but the renaming is only correct on Linux/Android (per wreq's README).
wreq-util = { version = "=3.0.0-rc.10", optional = true }

# --- screenshot rendering (Blitz, opt-in via `screenshot` feature) ---
# Upstream DioxusLabs/blitz, rev-pinned (bump deliberately). The old yinnho/blitz
# fork existed only for the no-op NetProvider critical-resource fix — merged
# upstream as DioxusLabs/blitz#636 (2026-08-08), so the fork is retired.
#
# WHY 2fa6434d (#724, parley 0.10) AND NOT main: parley 0.11 (#725 — a pure dep
# bump, zero blitz code change) hangs line breaking indefinitely on CJK-heavy
# pages. baidu.com never finishes layout even in release (spins in parley
# BreakLines::break_remaining under blitz compute_inline_layout). Bisected:
# #724 renders baidu in ~4s / 1533 colors; #726 (parley 0.11.1) still spinning
# at 150s. Reported upstream as linebender/parley#752 (repro minimized to a
# 1.4KB baidu IME-menu fragment + page CSS; not CJK-text-dependent).
#
# NOTE (2026-08-25): this pin is a REFERENCE-engine constraint only — the
# default /screenshot engine is diting, which has zero parley. Bump past
# 2fa6434d only if/when blitz is upgraded again AND parley#752 has landed
# upstream; doing so also unblocks #726–#735 (taffy sizing + spurious
# horizontal-scroll fixes).
#
# crates.io's blitz 0.3.0-beta.1 is a stale snapshot and upstream pins taffy to
# an unreleased git rev, so blitz-* must come from git. anyrender 0.13 /
# anyrender_vello_cpu 0.16 are on crates.io and are what blitz consumes here.
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "2fa6434d", optional = true, features = ["default"] }
blitz-html = { git = "https://github.com/DioxusLabs/blitz", rev = "2fa6434d", optional = true }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "2fa6434d", optional = true }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "2fa6434d", optional = true }
anyrender = { version = "0.13", optional = true }
anyrender_vello_cpu = { version = "0.16", optional = true, features = ["multithreading"] }
peniko = { version = "0.6", optional = true }
png = { version = "0.18", optional = true }
# Same version blitz-dom pins (0.25.x); jpeg/webp/gif are the only features we need.
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "webp", "gif"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
wreq = { version = "=6.0.0-rc.28", optional = true, features = ["prefix-symbols", "socks", "gzip", "brotli", "deflate", "zstd"] }

[target.'cfg(not(any(target_os = "linux", target_os = "android")))'.dependencies]
wreq = { version = "=6.0.0-rc.28", optional = true, features = ["socks", "gzip", "brotli", "deflate", "zstd"] }

[build-dependencies]
deno_core = "0.411"

[dev-dependencies]
ureq = { version = "2", features = ["json"] }

# Unwinding is REQUIRED: ops wrap their bodies in std::panic::catch_unwind so a
# panic degrades to an error return instead of unwinding into V8's FFI frame and
# aborting the process. panic="abort" turns every catchable op panic into a crash.
[profile.release]
panic = "unwind"
strip = true
