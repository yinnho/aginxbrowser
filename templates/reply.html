<!DOCTYPE html>
<!-- id: reply  兜底正文页·磷光终端 v2（frontend-design 分身生成 2026-09-24）。槽位 {{question}} {{body}}
     body 按 markdown 渲染（模板内 JS，引擎零改动）。离线设备：等宽字体栈，无外部资源。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>结果</title>
<style>
:root {
  --bg: #060a07;            /* 带绿调的深黑，非纯黑 */
  --bg-glow: #0d1811;       /* 顶部磷光余辉 */
  --fg: #d8e6d8;            /* 磷光白绿 */
  --accent: #3dfd8f;        /* 磷光绿，唯一强调色 */
  --muted: #7d9484;         /* 次级文字 */
  --dim: #23352a;           /* 分隔线 */
  --scan: rgba(63, 221, 143, 0.03);  /* 扫描线 */
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); }
body {
  min-height: 2620px;  /* 面板缓存 1080x2620：把缓存底也铺成磷光底，全页截图无白尾 */
  color: var(--fg);
  font: 400 38px/1.78 ui-monospace, "Droid Sans Mono", "Noto Sans Mono", monospace;
  padding: 104px 88px 160px;
  position: relative;
  overflow-wrap: break-word;
}
/* CRT 背景：扫描线纹理 + 顶部磷光辉光 + 下缘暗角 —— 背景不是纯色填充 */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    repeating-linear-gradient(to bottom, var(--scan) 0 1px, transparent 1px 6px),
    radial-gradient(120% 46% at 50% 0%, var(--bg-glow), transparent 70%),
    linear-gradient(to bottom, transparent 76%, rgba(0,0,0,0.55));
}
/* 问句 = 命令行回显：> 前缀 + 暗色 + 底部分隔 */
.q {
  color: var(--muted);
  font-size: 30px;
  line-height: 1.55;
  letter-spacing: 0.02em;
  padding-bottom: 30px;
  border-bottom: 1px solid var(--dim);
}
.q::before { content: "> "; color: var(--accent); }
article { margin-top: 64px; position: relative; }
p { margin: 0 0 44px; }
/* 列表行：缩进竖线 + ▸ 前缀，不用圆点 */
.row {
  padding-left: 44px;
  border-left: 2px solid var(--dim);
  margin: 20px 0;
  position: relative;
}
.row::before { content: "▸ "; color: var(--accent); }
strong { color: var(--accent); font-weight: 600; }
code {
  font-family: inherit;
  background: rgba(63, 221, 143, 0.09);
  padding: 2px 10px;
}
a { color: var(--accent); text-decoration-color: var(--dim); }
h2, h3, h4 { color: var(--fg); font-weight: 600; margin: 56px 0 32px; line-height: 1.3; }
h2 { font-size: 46px; }
h3 { font-size: 42px; }
h4 { font-size: 40px; }
hr {
  border: 0;
  height: 1px;
  background: linear-gradient(to right, var(--dim), transparent 80%);
  margin: 52px 0;
}
</style>
</head>
<body>
<p class="q">{{question}}</p>
<pre id="src" hidden>{{body}}</pre>
<article id="out"></article>
<script>
(function () {
  var src = document.getElementById('src').textContent;
  var out = document.getElementById('out');
  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
  }
  var lines = src.replace(/\r/g, '').split('\n');
  var html = [], buf = [];
  function flush() {
    if (buf.length) html.push('<p>' + buf.map(inline).join('<br>') + '</p>');
    buf = [];
  }
  for (var i = 0; i < lines.length; i++) {
    var L = lines[i], m;
    if (/^\s*$/.test(L)) { flush(); continue; }
    if ((m = L.match(/^(#{1,3})\s+(.*)$/))) {
      flush(); html.push('<h' + (m[1].length + 1) + '>' + inline(m[2]) + '</h' + (m[1].length + 1) + '>');
    } else if (/^\s*(-{3,}|\*{3,})\s*$/.test(L)) {
      flush(); html.push('<hr>');
    } else if ((m = L.match(/^\s*[-*]\s+(.*)$/))) {
      flush(); html.push('<div class="row">' + inline(m[1]) + '</div>');
    } else if ((m = L.match(/^\s*(\d+)[.、)]\s*(.*)$/))) {
      flush(); html.push('<div class="row">' + m[1] + '. ' + inline(m[2]) + '</div>');
    } else {
      buf.push(L);
    }
  }
  flush();
  out.innerHTML = html.join('');
})();
</script>
</body>
</html>
