<!DOCTYPE html>
<!--
  id: weather
  注册表: templates/registry.json（浏览器目录）
  槽位: {{city}} {{temp}} {{condition}} {{low}} {{high}} {{humidity}} {{uv}} {{source_url}}
  面板 1080×2340。font-size / line-height / font-family 分开写。不要 font 简写，不要 vh。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>{{city}}天气</title>
<style>
html, body { background-color: #0c100e; }
body {
  min-height: 2340px;
  margin: 0;
  background-image: linear-gradient(180deg, #5c4d3e 0%, #24302b 36%, #0c100e 100%);
  color: #f6f1e8;
  font-size: 32px;
  line-height: 1.4;
  font-family: sans-serif;
  padding: 160px 72px 120px;
}
.where {
  margin: 0;
  color: #ead9b8;
  font-size: 30px;
  line-height: 1.2;
  font-family: sans-serif;
  letter-spacing: 10px;
}
.rule {
  width: 72px;
  height: 6px;
  margin: 28px 0 0;
  background-color: #c4a574;
  border-radius: 3px;
}
.temp {
  margin: 36px 0 0;
  color: #f7f3ea;
  font-size: 220px;
  line-height: 0.88;
  font-weight: 700;
  font-family: sans-serif;
}
.unit {
  color: #ead9b8;
  font-size: 72px;
  line-height: 1;
  font-weight: 500;
  font-family: sans-serif;
}
.cond {
  display: inline-block;
  margin: 36px 0 0;
  padding: 14px 32px;
  background-color: #2c2822;
  color: #ead9b8;
  font-size: 34px;
  line-height: 1.2;
  font-family: sans-serif;
  border-radius: 999px;
}
.row {
  display: flex;
  margin-top: 88px;
}
.card {
  width: 286px;
  margin-right: 22px;
  padding: 32px 28px 36px;
  background-color: #1a211e;
  background-image: linear-gradient(180deg, #2a3832 0%, #151c19 100%);
  border-radius: 32px;
}
.card-last { margin-right: 0; }
.k {
  margin: 0;
  color: #a8b2a8;
  font-size: 24px;
  line-height: 1.2;
  font-family: sans-serif;
  letter-spacing: 4px;
}
.v {
  margin: 16px 0 0;
  color: #f7f3ea;
  font-size: 56px;
  line-height: 1;
  font-weight: 700;
  font-family: sans-serif;
}
.uv {
  margin: 56px 0 0;
  color: #c9c2b4;
  font-size: 30px;
  line-height: 1.4;
  font-family: sans-serif;
}
.src {
  margin: 28px 0 0;
  color: #8e978e;
  font-size: 24px;
  line-height: 1.4;
  font-family: sans-serif;
}
a { color: #d7c4a2; text-decoration: none; }
</style>
</head>
<body>
<p class="where">{{city}}</p>
<div class="rule"></div>
<p class="temp">{{temp}}<span class="unit">°</span></p>
<p class="cond">{{condition}}</p>
<div class="row">
  <div class="card"><p class="k">最低</p><p class="v">{{low}}°</p></div>
  <div class="card"><p class="k">最高</p><p class="v">{{high}}°</p></div>
  <div class="card card-last"><p class="k">湿度</p><p class="v">{{humidity}}</p></div>
</div>
<p class="uv">紫外线 {{uv}}</p>
<p class="src"><a href="{{source_url}}">{{source_url}}</a></p>
</body>
</html>
