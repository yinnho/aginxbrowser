[package]
name = "diting_runtime"
version = "0.1.0"
edition = "2021"
description = "The Diting JS runtime crate: the event loop, op-settlement pipeline, and promise table we own — the deno_core retirement campaign (docs/diting_runtime认领计划_20261017.md)."
license = "Apache-2.0"
repository = "https://github.com/yinnho/aginxbrowser"
publish = false

# One dependency, by design: V8 itself, pinned (same =150.4.0 as the rest of
# the workspace — one build, and version moves stay our decision, aligned with
# UA/TLS fingerprint declarations). Feature-for-feature the same declaration
# deno_core uses (simdutf, no defaults): a `-p diting_runtime` solo build
# then downloads the SAME prebuilt static lib as the full workspace build —
# v8's build script shares one gn_out/obj path per target dir, and two
# variants would clobber each other on every alternation.
[dependencies]
v8 = { version = "=150.4.0", default-features = false, features = ["simdutf"] }
# op_glue (verbatim deno_core 0.411 helper copies) needs serde_v8's V8Slice
# and serde for the SerdeMarker return face. Leaf utility crates — they stay
# after deno_core retires, unlike deno_core itself.
serde = "1"
serde_v8 = "0.320"
