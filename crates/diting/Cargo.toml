[package]
name = "diting"
version = "0.5.8"
edition = "2021"
description = "The Diting (谛听) browser engine: network → DOM → CSS → layout → paint, V8 runtime, the Page API. Foundation of AginxBrowser."
license = "Apache-2.0"
repository = "https://github.com/yinnho/aginxbrowser"
publish = false

[features]
default = []
# The blitz reference pipeline's parley FontContext (diting_fonts::font_ctx
# and friends). The engine never depends on blitz itself; this only gates the
# small FontContext surface the product crate's blitz cross-check pipeline
# consumes — forwarded from the product's `blitz-reference` feature.
blitz-reference = ["dep:parley"]
# Stealth HTTP client with TLS/JA3 fingerprint spoofing via wreq (BoringSSL).
# Disable for plain reqwest-only builds.
stealth = ["dep:wreq", "dep:wreq-util"]
# Screenshot rendering via the diting engine (own CSS+layout+paint
# stack on the taffy/parley/swash/vello_cpu foundation). Opt-in; renders the
# JS-rendered DOM (captured by the diting V8 path) to a PNG — no Chromium
# required, no blitz.
screenshot = [
    "dep:anyrender",
    "dep:anyrender_vello_cpu",
    "dep:peniko",
    "dep:png",
    # JPEG/WebP/GIF decode for diting_layout's ImageCache (batches 6d/7b/7e).
    # Same `image` crate version blitz-dom decodes with, so RGBA output is
    # identical (only relevant when blitz-reference is also on). Animated
    # GIFs take the first frame. `png` is needed by the CDP legacy path,
    # which re-encodes JPEG captures from the rendered PNG bytes.
    "dep:image",
    "image/jpeg",
    "image/png",
    "image/webp",
    "image/gif",
    # Taffy does diting's box layout.
    "dep:taffy",
    # Real glyph measurement + rasterization for diting_layout text leaves
    # (render claim batches 3a/3b). Same stack upstream obscura-render builds
    # on. scale/render are the outline raster features (3b paint).
    "dep:swash",
    # parley is consumed ONLY behind `blitz-reference` (diting_fonts'
    # FontContext + the cross-check fixtures); diting's own text stack is
    # swash + its own greedy_wrap (batch 72). Kept under `screenshot` for
    # historical layering — blitz-reference gates on screenshot.
    "dep:parley",
    # musl cross builds cannot link fontconfig at build time (no pkg-config
    # sysroot). dlopen defers libfontconfig to runtime; fontique degrades
    # gracefully when it is absent (bundled CJK fonts carry the render).
    "fontique/fontconfig-dlopen",
]

[dependencies]
# Taffy git pin, mirroring blitz's workspace declaration (their tree tracks
# taffy main; c17b313 is the rev blitz 916fa89 pins).
# When blitz-reference is also enabled, features must EXACTLY mirror blitz's
# workspace declaration (default-features = false, no float_layout): cargo
# unifies features across the graph, so any extra feature would silently
# change the product pipeline's layout behavior (float_layout alters block
# layout). In a screenshot-only build there is no unification partner, but
# keep the mirror anyway so toggling blitz-reference can't shift diting.
# taffy_tree is additionally listed because the unified graph already enables
# it (Cargo.lock shows taffy pulling slotmap) — an explicit no-op.
# Used by diting_layout box layout and the fork-delta tests (docs/engine/render.md).
taffy = { git = "https://github.com/DioxusLabs/taffy", rev = "c17b313cd1be5a4def91522cf3ea5995e664ebf7", optional = true, default-features = false, features = [
    "std",
    "taffy_tree",
    "flexbox",
    "grid",
    "block_layout",
    "content_size",
    "calc",
    "detailed_layout_info",
] }
# Shaped advances + font metrics (batch 3a) and glyph rasterization (3b) for
# diting_layout text leaves. Same stack upstream obscura-render builds on.
# default-features=false + explicit std/scale/render: no variations/simd knob
# we don't use (default set is std+scale+render anyway — pin it explicitly).
swash = { version = "0.2", optional = true, default-features = false, features = [
    "std",
    "scale",
    "render",
] }
# parley provides the FontContext the blitz-reference cross-check fixtures
# build (diting itself shapes via swash). Mirrors blitz's own declaration
# (default-features false, std) so the unified graph can't drift blitz's
# parley behavior when blitz-reference is on.
parley = { version = "0.11.1", optional = true, default-features = false, features = ["std"] }
# Runtime-dlopen fontconfig for musl cross builds (see `screenshot` feature).
fontique = { version = "0.11", optional = true }
# --- async runtime ---
tokio = { version = "1", features = ["full"] }
futures = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
uuid = { version = "1", features = ["v4"] }

# --- serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# --- tracing ---
tracing = "0.1"

# --- http client (non-stealth path) ---
reqwest = { version = "0.12", features = ["cookies", "gzip", "brotli", "deflate", "rustls-tls", "socks", "json", "stream"], default-features = false }
# Page-facing WebSocket transport: handshake runs over our own TcpStream/TLS
# stack (client_async validates the 101 upgrade itself); tokio-tungstenite is
# already in the tree via axum's ws feature.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
http = "1"
# Same versions the tree already carries (reqwest rustls-tls path) — pinning
# the same lines keeps the lockfile free of duplicate major versions.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "0.26"
tokio-socks = "0.5"
encoding_rs = "0.8"
tempfile = "3"
url = "2"

# --- html / dom parsing ---
html5ever = "0.29"
markup5ever = "0.14"
selectors = "0.26"
servo_arc = "0.4"
cssparser = "0.34"
precomputed-hash = "0.1"

# --- V8 / JS runtime (inlined obscura-js) ---
deno_core = "0.411"
deno_error = "0.7"
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
# WebCrypto (crypto.subtle) secret-key primitives. RustCrypto, pure Rust, no
# CMake/OpenSSL, unify on the digest 0.10 / cipher 0.4 stack already in tree.
hmac = "0.12"
aes = "0.8"
aes-gcm = "0.10"
cbc = { version = "0.1", features = ["alloc"] }
ctr = "0.9"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
hkdf = "0.12"
# ECDSA (P-256/P-384) for crypto.subtle — same RustCrypto family as the
# secret-key ops. `ecdsa` is a direct dep for the hazmat prehash traits;
# p256/p384 with arithmetic+pkcs8 for key encode/decode. rand_core's OsRng
# (over the getrandom 0.2 already in tree) drives key generation.
ecdsa = { version = "0.16", default-features = false, features = ["signing", "verifying", "hazmat", "pkcs8", "pem"] }
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa", "ecdh", "pkcs8", "std"] }
p384 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa", "ecdh", "pkcs8", "std"] }
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
# CSPRNG for getRandomValues / randomUUID (replaces Math.random).
getrandom = "0.2"

# --- stealth client (TLS fingerprint spoofing) ---
# Pin exact versions: wreq/wreq-util are pre-release rc crates whose API shifts
# between builds; a caret requirement could pull an incompatible rc and break.
# prefix-symbols renames BoringSSL exports to avoid clashing with system OpenSSL,
# but the renaming is only correct on Linux/Android (per wreq's README).
wreq-util = { version = "=3.0.0-rc.14", optional = true }

# --- render output encoding (screenshot) ---
anyrender = { version = "0.13", optional = true }
anyrender_vello_cpu = { version = "0.17", optional = true, features = ["multithreading"] }
peniko = { version = "0.6", optional = true }
png = { version = "0.18", optional = true }
# Same version blitz-dom pins (0.25.x); jpeg/webp/gif are the only features we need.
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "webp", "gif"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
wreq = { version = "=6.0.0-rc.31", optional = true, features = ["prefix-symbols", "socks", "gzip", "brotli", "deflate", "zstd"] }

[target.'cfg(not(any(target_os = "linux", target_os = "android")))'.dependencies]
wreq = { version = "=6.0.0-rc.31", optional = true, features = ["socks", "gzip", "brotli", "deflate", "zstd"] }

[build-dependencies]
deno_core = "0.411"

[dev-dependencies]
# Test-only decode oracle for the hand-rolled canvas PNG encoder (#117):
# the product never links it in default builds (it stays behind `screenshot`).
png = "0.18"
