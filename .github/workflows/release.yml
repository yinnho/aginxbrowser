name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools musl-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --features stealth,screenshot --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CXX_x86_64_unknown_linux_musl: musl-g++
          AR_x86_64_unknown_linux_musl: ar
          # fontique→yeslogic-fontconfig-sys: skip pkg-config cross-compile,
          # dlopen libfontconfig at runtime instead (musl static binaries support this)
          RUST_FONTCONFIG_DLOPEN: 1
      - name: Package
        run: |
          dir=aginxbrowser-v${GITHUB_REF_NAME#v}-${{ matrix.target }}
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/aginxbrowser" "$dir/"
          cp README.md docs/install.md "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          shasum -a 256 "$dir.tar.gz" > "$dir.tar.gz.sha256"
      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aginxbrowser-*.tar.gz
            aginxbrowser-*.sha256
