name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install fontconfig dev libs (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --features stealth,screenshot --target ${{ matrix.target }}
      - name: Package
        run: |
          dir=aginxbrowser-v${GITHUB_REF_NAME#v}-${{ matrix.target }}
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/aginxbrowser" "$dir/"
          cp README.md docs/install.md "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          shasum -a 256 "$dir.tar.gz" > "$dir.tar.gz.sha256"
      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aginxbrowser-*.tar.gz
            aginxbrowser-*.sha256

  # AginxOS pulls this asset on device first-boot: bare static binary +
  # sha256 (agpkg convention), so NO features — stealth (BoringSSL) and
  # screenshot stay opt-in. The screenshot-enabled variant for the same
  # device lives in build-musl-screenshot below.
  #
  # v0.2.10 postmortem: build.rs embeds a V8 snapshot of bootstrap.js, and
  # V8 snapshots are architecture-specific — cross-building on an x86_64
  # runner baked an x86_64 snapshot into the aarch64 binary (instant
  # SIGSEGV, zero output, found on a Pixel 5). These jobs now run on native
  # arm64 runners so the snapshot matches the target, and smoke-run the
  # actual artifact before it ships.
  build-musl:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - name: Install zig
        run: |
          curl -fsSL https://ziglang.org/download/0.16.0/zig-aarch64-linux-0.16.0.tar.xz | sudo tar -xJ -C /opt
          echo "/opt/zig-aarch64-linux-0.16.0" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-unknown-linux-musl-arm64
      - name: Build
        run: cargo zigbuild --release --target aarch64-unknown-linux-musl
        env:
          # Keep the symbol table so the -debug twin can attribute crashes
          # (device kernels don't log userspace segfaults); the shipped
          # binary is stripped from this copy in Package.
          CARGO_PROFILE_RELEASE_STRIP: "false"
      - name: Package
        run: |
          bin=aginxbrowser-v${GITHUB_REF_NAME#v}-aarch64-unknown-linux-musl
          cp target/aarch64-unknown-linux-musl/release/aginxbrowser "$bin"
          cp "$bin" "$bin-debug"
          strip "$bin"
          shasum -a 256 "$bin" > "$bin.sha256"
          shasum -a 256 "$bin-debug" > "$bin-debug.sha256"
          echo "bin=$bin" >> "$GITHUB_ENV"
      - name: Smoke run
        run: |
          timeout 15 "./$bin" > smoke.log 2>&1 || true
          grep -q "listening on" smoke.log || { echo "--- smoke output ---"; cat smoke.log; exit 1; }
          head -1 smoke.log
      - name: Upload actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: aginxbrowser-aarch64-musl
          path: |
            aginxbrowser-*-aarch64-unknown-linux-musl
            aginxbrowser-*-aarch64-unknown-linux-musl-debug
            aginxbrowser-*-aarch64-unknown-linux-musl.sha256
            aginxbrowser-*-aarch64-unknown-linux-musl-debug.sha256
          retention-days: 7
      - name: Upload release assets (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aginxbrowser-*-aarch64-unknown-linux-musl
            aginxbrowser-*-aarch64-unknown-linux-musl-debug
            aginxbrowser-*-aarch64-unknown-linux-musl.sha256
            aginxbrowser-*-aarch64-unknown-linux-musl-debug.sha256

  # The AginxOS engine build: same aarch64 musl static target and agpkg
  # shape as build-musl, but WITH `--features screenshot` — the pure diting
  # render stack (zero blitz since the feature split), so the device gets
  # rendering without a self-build. fontique's fontconfig-dlopen (in the
  # screenshot feature) keeps the cross build free of a pkg-config sysroot;
  # libfontconfig stays optional at runtime, bundled CJK fonts carry the
  # render (AginxOS-verified on device). workflow_dispatch builds main HEAD
  # without touching any release (the actions artifact carries the binary).
  # Same arm64-native + smoke discipline as build-musl (see postmortem there).
  build-musl-screenshot:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - name: Install zig
        run: |
          curl -fsSL https://ziglang.org/download/0.16.0/zig-aarch64-linux-0.16.0.tar.xz | sudo tar -xJ -C /opt
          echo "/opt/zig-aarch64-linux-0.16.0" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-unknown-linux-musl-screenshot-arm64
      - name: Build
        run: cargo zigbuild --release --target aarch64-unknown-linux-musl --features screenshot
        env:
          CARGO_PROFILE_RELEASE_STRIP: "false"
      - name: Package
        run: |
          ver=${GITHUB_REF_NAME#v}
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *) ver="main-$(git rev-parse --short HEAD)" ;;
          esac
          bin=aginxbrowser-$ver-aarch64-unknown-linux-musl-screenshot
          cp target/aarch64-unknown-linux-musl/release/aginxbrowser "$bin"
          cp "$bin" "$bin-debug"
          strip "$bin"
          shasum -a 256 "$bin" > "$bin.sha256"
          shasum -a 256 "$bin-debug" > "$bin-debug.sha256"
          echo "bin=$bin" >> "$GITHUB_ENV"
      - name: Smoke run
        run: |
          timeout 15 "./$bin" > smoke.log 2>&1 || true
          grep -q "listening on" smoke.log || { echo "--- smoke output ---"; cat smoke.log; exit 1; }
          head -1 smoke.log
      - name: Upload actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: aginxbrowser-aarch64-musl-screenshot
          path: |
            aginxbrowser-*-aarch64-unknown-linux-musl-screenshot
            aginxbrowser-*-aarch64-unknown-linux-musl-screenshot-debug
            aginxbrowser-*-aarch64-unknown-linux-musl-screenshot.sha256
            aginxbrowser-*-aarch64-unknown-linux-musl-screenshot-debug.sha256
          retention-days: 7
      - name: Upload release assets (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aginxbrowser-*-aarch64-unknown-linux-musl-screenshot
            aginxbrowser-*-aarch64-unknown-linux-musl-screenshot-debug
            aginxbrowser-*-aarch64-unknown-linux-musl-screenshot.sha256
            aginxbrowser-*-aarch64-unknown-linux-musl-screenshot-debug.sha256
