name: docker

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Mirror to Docker Hub when DOCKERHUB_USERNAME/TOKEN secrets are set
  # (steps skip — not fail — otherwise). Copies the GHCR tags over, so no
  # second full build. The secrets context can't be referenced in `if:`,
  # so each gated step mirrors the secrets into env and tests that.
  dockerhub:
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/yinnho/aginxbrowser
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login Docker Hub
        env:
          DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        if: ${{ env.DH_USERNAME != '' && env.DH_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copy GHCR tags to Docker Hub
        env:
          DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        if: ${{ env.DH_USERNAME != '' && env.DH_TOKEN != '' }}
        run: |
          for tag in ${{ steps.meta.outputs.tags }}; do
            name="${tag##*:}"
            echo "→ docker.io/yinnho/aginxbrowser:$name (from ghcr.io/yinnho/aginxbrowser:$name)"
            docker buildx imagetools create \
              --tag "docker.io/yinnho/aginxbrowser:$name" \
              "ghcr.io/yinnho/aginxbrowser:$name"
          done
