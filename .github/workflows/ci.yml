# Full test suite + feature-combination compile gates on every PR/push.
# Before this existed, PRs (dependabot included) ran only a 36s scan job —
# a "green" check carried zero test signal, and a Cargo.toml bump that broke
# `cargo metadata` resolution would have merged clean (see the wreq dual
# target-section pin incident, 2026-09).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test --features screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: test-screenshot
      - name: Test
        # --workspace is load-bearing: the repo is a root-package workspace
        # (crates/diting), and without it cargo tests only the root package,
        # silently dropping the engine crate's unit tests.
        run: cargo test --workspace --features screenshot

  check-stealth:
    # wreq lives behind `stealth` and is exact-pinned (`=`) in TWO target
    # sections — the only combination that compiles the BoringSSL/btls path
    # and the one a single-section dependabot bump silently breaks.
    name: cargo check --features stealth,screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: check-stealth
      - name: Check
        # --workspace: same reason as the test job — the engine crate must
        # compile under the feature combination too, not just the product.
        run: cargo check --workspace --features stealth,screenshot
